name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 3.9 is EOL and not on the newest Ubuntu runner; still the documented minimum
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tzdata (Windows has no system zoneinfo)
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
