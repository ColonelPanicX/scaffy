name: Refresh scaffy-example

on:
  push:
    branches: [main]
    paths:
      - "scaffy.py"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate scaffy-example
        run: |
          rm -rf scaffy-example
          python scaffy.py --name scaffy-example --path . \
            --governance standard --platform github --license none \
            --description "Example scaffold output generated by scaffy." \
            --force

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- scaffy-example/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scaffy-example/
          git add -f scaffy-example/.collab/
          git commit -m "chore: auto-refresh scaffy-example to match current scaffold output"
          git push
