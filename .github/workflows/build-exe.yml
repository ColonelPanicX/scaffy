name: Build Windows EXE

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller tzdata customtkinter

      - name: Build scaffy EXE
        run: |
          pyinstaller --onefile --windowed --name scaffy --icon scaffy.ico --hidden-import tzdata scaffy_gui.py

      - name: Build scafrag EXE
        run: |
          pyinstaller --onefile --name scafrag --hidden-import tzdata scafrag.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scaffy-windows
          path: |
            dist/scaffy.exe
            dist/scafrag.exe

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/scaffy.exe
            dist/scafrag.exe
            scaffy.py
            scafrag.py
