[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffy-collab"
version = "1.11.0"
description = "Bootstrap a .collab/ multi-agent collaboration workspace for any project"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["scaffold", "collab", "ai", "agents", "llm", "project-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ColonelPanicX/scaffy"
"Bug Tracker" = "https://github.com/ColonelPanicX/scaffy/issues"
Changelog = "https://github.com/ColonelPanicX/scaffy/releases"

[project.scripts]
scaffy = "scaffy:main"

[project.optional-dependencies]
windows = ["tzdata"]

[tool.setuptools]
py-modules = ["scaffy"]
